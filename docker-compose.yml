services:
  # BASE DE DATOS
  base_datos:
    image: postgres:18-alpine
    #restart: always
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} --dbname=${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. BACKEND
  backend:
    build: ./backend
    #restart: always
    restart: unless-stopped
    depends_on:
      base_datos:
        condition: service_healthy
    # ports:
    #   - "3000:3000"
    environment:
      DB_HOST: base_datos
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # 3. FRONTEND
  frontend:
    build: ./frontend
    #restart: always
    restart: unless-stopped
    # ports:
    #   - "8080:8080"
    networks:
      - frontend-net

  # PROXY INVERSO
  proxy:
    image: nginx:1.26-alpine
    #restart: always
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "80" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # OBSERVABILIDAD
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      #- /:/host/root:ro,rslave
    networks:
      - backend-net
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    pid: host
    user: "0:0"

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - '--web.enable-remote-write-receiver'

  loki:
    image: grafana/loki:3.6.17
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    networks:
      - backend-net
    command: -config.file=/etc/loki/loki-config.yml

  grafana:
    image: grafana/grafana:10.1.0
    #restart: always
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    networks:
      - backend-net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
